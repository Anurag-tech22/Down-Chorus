services:
  - type: web
    name: dawn-chorus
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: LLAMA_URL
        fromService:
          type: pserv
          name: dawn-gemma
          property: hostport
  - type: pserv
    name: dawn-gemma
    runtime: docker
    dockerfilePath: ./llm/Dockerfile
    dockerContext: ./llm
